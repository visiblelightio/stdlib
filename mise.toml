[tools]
bats = "1.14.0"
gh = "2.102.0"
hk = "2.7.0"
node = "24.22.0"
npm = "12.2.0"
oxfmt = "0.73.0"
pkl = "0.32.1"
terraform = "1.16.6"
"github:woodpecker-ci/woodpecker" = { version = "3.19.0", matching = "woodpecker-cli_" }

[hooks]
enter = { task = "hooks:install" }
postinstall = "hk install --mise"

[tasks."hooks:install"]
description = "Install repository-local Git hooks"
run = "hk install --mise"

[tasks.check]
description = "Validate package and repository checks"
run = "npm run check && hk check --all"

[tasks."ci:lint"]
description = "Validate Woodpecker workflows"
run = "woodpecker-cli lint --strict .woodpecker"

[tasks."infra:login"]
description = "Log in to HCP Terraform"
raw = true
run = "terraform login"

[tasks."infra:github:init"]
description = "Initialize Terraform for GitHub repository management"
raw = true
run = "terraform -chdir=infra/github init"

[tasks."infra:github:plan"]
description = "Preview GitHub repository configuration changes"
raw = true
run = "terraform -chdir=infra/github plan"

[tasks."infra:github:apply"]
description = "Apply GitHub repository configuration changes after confirmation"
raw = true
run = "terraform -chdir=infra/github apply"
