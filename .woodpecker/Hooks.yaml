when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: Hooks
    image: ghcr.io/jdx/mise:2026.10.4-debian@sha256:2fb7fa9a4120333531a8a70296d4ea152ffd3e7658dcf29ac75774a7d78dec24
    commands:
      - mise trust
      - mise install
      - mise exec -- hk validate --deny-warnings
